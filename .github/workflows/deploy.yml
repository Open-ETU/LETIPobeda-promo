name: Publish built frontend

on:
  workflow_call:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      YC_BUCKET_NAME: ${{ secrets.YC_BUCKET_NAME }}
      YC_CDN_RESOURCE_ID: ${{ secrets.YC_CDN_RESOURCE_ID }}
      YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
      YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
      YC_SERVICE_ACCOUNT_KEY: ${{ secrets.YC_SERVICE_ACCOUNT_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
      - name: Install YC CLI
        run: |
          curl --fail --silent --show-error --location https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$RUNNER_TEMP/yc" -n
          echo "$RUNNER_TEMP/yc/bin" >> "$GITHUB_PATH"
      - name: Publish assets then HTML
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/leti-deploy-key.json"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY" > "$key_file"
          chmod 600 "$key_file"
          yc config set service-account-key "$key_file"
          yc config set cloud-id "$YC_CLOUD_ID"
          yc config set folder-id "$YC_FOLDER_ID"
          python3 scripts/deploy-static.py --dist frontend/dist --bucket "$YC_BUCKET_NAME"
          if [[ -n "$YC_CDN_RESOURCE_ID" ]]; then
            if ! yc cdn cache purge --resource-id "$YC_CDN_RESOURCE_ID" --path '/' --path '/index.html'; then
              echo '::warning::HTML published. CDN purge unavailable; the 60-second HTML cache will expire normally.'
            fi
          fi
